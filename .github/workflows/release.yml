name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  RELEASE_REPO: jelly-terminal/releases

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only."; exit 1; }

  build:
    needs: verify
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db" >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Downgrade project format
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Jelly.xcodeproj/project.pbxproj

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Jelly.xcodeproj \
            -scheme Jelly \
            -configuration Release \
            -archivePath build/Jelly.xcarchive \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            archive \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Jelly.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER=""

          codesign --verify --deep --strict --verbose=2 build/export/Jelly.app

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Jelly" \
            --window-size 640 360 \
            --icon-size 96 \
            --icon "Jelly.app" 180 170 \
            --hide-extension "Jelly.app" \
            --app-drop-link 460 170 \
            "Jelly-${TAG}.dmg" \
            build/export/Jelly.app

      - name: Sign DMG
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "Jelly-${TAG}.dmg"
          codesign --verify --verbose=2 "Jelly-${TAG}.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials jelly-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          xcrun notarytool submit "Jelly-${TAG}.dmg" \
            --keychain-profile jelly-notary \
            --keychain "$KEYCHAIN_PATH" \
            --wait

          xcrun stapler staple "Jelly-${TAG}.dmg"
          spctl -a -t open --context context:primary-signature -vv "Jelly-${TAG}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: Jelly-${{ github.ref_name }}.dmg

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          BIN=$(find build/SourcePackages/artifacts -name generate_appcast -type f | head -1)
          mkdir appcast && cp "Jelly-${TAG}.dmg" appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$BIN" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ env.RELEASE_REPO }}/releases/download/${TAG}/" \
            appcast

      - uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: appcast/appcast.xml

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dmg

      - uses: actions/download-artifact@v4
        with:
          name: appcast

      - name: Generate release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$RELEASE_REPO" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            "Jelly-${GITHUB_REF_NAME}.dmg" \
            appcast.xml
